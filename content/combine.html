<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Combine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --board: #1a2420;
      --board-light: #243028;
      --chalk-yellow: #f5e6a8;
      --chalk-pink: #f4a8c8;
      --chalk-cyan: #9ee8f0;
      --chalk-lime: #c8f0a0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      background:
        radial-gradient(ellipse 120% 80% at 20% 10%, rgba(255, 255, 255, 0.04), transparent 50%),
        radial-gradient(ellipse 90% 60% at 85% 90%, rgba(0, 0, 0, 0.35), transparent 45%),
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 3px,
          rgba(255, 255, 255, 0.015) 3px,
          rgba(255, 255, 255, 0.015) 4px
        ),
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 7px,
          rgba(0, 0, 0, 0.12) 7px,
          rgba(0, 0, 0, 0.12) 8px
        ),
        linear-gradient(165deg, var(--board-light), var(--board) 40%, #121816);
      font-family: "Caveat", cursive;
    }

    .board {
      position: relative;
      width: min(100%, 22rem);
      padding: 2.5rem 2rem 3rem;
      border: 6px solid #3d4a42;
      border-radius: 4px;
      box-shadow:
        inset 0 0 40px rgba(0, 0, 0, 0.45),
        0 12px 28px rgba(0, 0, 0, 0.5);
      background:
        radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.03) 0 1px, transparent 1px),
        radial-gradient(circle at 70% 60%, rgba(255, 255, 255, 0.025) 0 1px, transparent 1px),
        var(--board);
    }

    .board::before {
      content: "";
      position: absolute;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.08'/%3E%3C/svg%3E");
      pointer-events: none;
      opacity: 0.6;
      mix-blend-mode: overlay;
    }

    .words {
      margin: 0;
      list-style: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-size: clamp(2.4rem, 8vw, 3.4rem);
      line-height: 1.05;
      font-weight: 700;
    }

    .words li {
      text-shadow:
        0 0 1px currentColor,
        0 0 8px color-mix(in srgb, currentColor 35%, transparent),
        1px 2px 0 rgba(0, 0, 0, 0.25);
      filter: url(#chalk);
    }

    .words li:nth-child(1) {
      color: var(--chalk-yellow);
      transform: rotate(-2.5deg) translateX(0.15rem);
    }

    .words li:nth-child(2) {
      color: var(--chalk-pink);
      transform: rotate(1.8deg) translateX(1.1rem);
    }

    .words li:nth-child(3) {
      color: var(--chalk-cyan);
      transform: rotate(-1.2deg) translateX(0.4rem);
    }

    .words li:nth-child(4) {
      color: var(--chalk-lime);
      transform: rotate(2.4deg) translateX(1.6rem);
    }
  </style>
</head>
<body>
  <svg width="0" height="0" aria-hidden="true">
    <defs>
      <filter id="chalk" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <main class="board">
    <ul class="words" aria-label="Chalk words">
      <li>shine</li>
      <li>combine</li>
      <li>line</li>
      <li>combine</li>
    </ul>
  </main>
</body>
</html>
